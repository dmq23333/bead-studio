<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>样图对比</title>
    <style>
      body {
        font:
          14px system-ui,
          sans-serif;
        margin: 16px;
        background: #f6f5f1;
        color: #222;
      }
      .row {
        display: flex;
        gap: 16px;
        align-items: flex-start;
        flex-wrap: wrap;
        margin: 16px 0 32px;
      }
      figure {
        margin: 0;
      }
      figcaption {
        margin-top: 4px;
        color: #555;
      }
      img,
      canvas {
        max-width: 480px;
        height: auto;
        background: #ddd;
      }
    </style>
  </head>
  <body>
    <h1>样图对比</h1>
    <p>
      在仓库根目录运行 <code>npm run samples</code>，打开
      <code>http://localhost:8000/tests/samples/compare.html</code>。改了
      <code>dist/core.mjs</code> 后刷新页面即可。
    </p>
    <label
      >尺寸
      <select id="size">
        <option>52</option>
        <option>104</option>
      </select></label
    >
    <div id="out"></div>
    <script type="module">
      import { convert, dominantShare, palette } from "../../dist/core.mjs";
      // add a sample: drop the image in this folder and list it here;
      // reference = an expected / AI-made pattern image to compare against
      const SAMPLES = [
        { file: "miffy.jfif", colors: 2 },
        {
          file: "landscape.jfif",
          colors: 27,
          reference: "Jardin_Rosaleda_MARD_52x29.png",
        },
      ];
      const load = (src) =>
        new Promise((ok, fail) => {
          const img = new Image();
          img.onload = () => ok(img);
          img.onerror = fail;
          img.src = src;
        });
      // ponytail: mirrors setSource() + sampleSource() in dist/app.mjs (default
      // detail slider); keep them in step
      function sample(img, W) {
        const probe = document.createElement("canvas");
        probe.width = probe.height = 96;
        const p = probe.getContext("2d", { willReadFrequently: true });
        p.imageSmoothingEnabled = false;
        p.drawImage(img, 0, 0, 96, 96);
        const flat =
            dominantShare(p.getImageData(0, 0, 96, 96).data, palette) >= 0.85,
          k = flat
            ? Math.max(
                8,
                Math.min(
                  16,
                  Math.ceil(Math.max(img.width / W, img.height / W)),
                ),
              )
            : 1,
          sw = W * k,
          c = document.createElement("canvas");
        c.width = c.height = sw;
        const g = c.getContext("2d", { willReadFrequently: true });
        g.imageSmoothingEnabled = !flat;
        g.imageSmoothingQuality = "high";
        if (!flat) g.filter = "blur(0.32px)";
        const s = Math.min(sw / img.width, sw / img.height),
          dw = img.width * s,
          dh = img.height * s;
        g.drawImage(img, (sw - dw) / 2, (sw - dh) / 2, dw, dh);
        return { data: g.getImageData(0, 0, sw, sw).data, k, flat };
      }
      function beads(cells, W) {
        const c = document.createElement("canvas"),
          p = 8;
        c.width = c.height = W * p;
        const g = c.getContext("2d");
        cells.forEach((v, i) => {
          if (v === null) return;
          g.fillStyle = palette[v].hex;
          g.beginPath();
          g.arc(
            (i % W) * p + p / 2,
            Math.floor(i / W) * p + p / 2,
            p / 2 - 0.5,
            0,
            7,
          );
          g.fill();
        });
        return c;
      }
      const figure = (el, text) => {
        const f = document.createElement("figure"),
          cap = document.createElement("figcaption");
        cap.textContent = text;
        f.append(el, cap);
        return f;
      };
      async function run() {
        const W = Number(size.value),
          out = document.getElementById("out");
        out.textContent = "";
        for (const s of SAMPLES) {
          const img = await load(s.file),
            { data, k, flat } = sample(img, W),
            t = performance.now(),
            cells = convert(data, W, W, palette, s.colors, flat, k),
            used = new Set(cells.filter((v) => v !== null)).size,
            row = document.createElement("div");
          row.className = "row";
          row.append(
            figure(img.cloneNode(), `${s.file}（${img.width}×${img.height}）`),
            figure(
              beads(cells, W),
              `本项目 ${W}×${W} · ${flat ? "锐利边缘+清理" : "平均缩放"} · ${used} 色（上限 ${s.colors}）· ${Math.round(performance.now() - t)} ms`,
            ),
          );
          if (s.reference)
            row.append(figure(await load(s.reference), `参考：${s.reference}`));
          out.append(row);
        }
      }
      size.onchange = run;
      run();
    </script>
  </body>
</html>
