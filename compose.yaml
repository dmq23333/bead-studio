name: bead-studio-20261028-v3
services:
  app:
    container_name: bead-studio-app
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      OLLAMA_URL: http://ollama:11434
    depends_on:
      - ollama
  ollama:
    container_name: bead-studio-ollama
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
volumes:
  ollama:
